<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cadastro figuritos</title>
    <link rel="stylesheet" href="styleCadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
<div id="cadastro">
    <h1 id="titulo-cadastro">cadastro de figurinha</h1>
    <div>
        <p class="p-cadastro">nome: </p>
        <input type="text" class="inpt-cadastro" id="nome">

        <p class="p-cadastro">selecão: </p>
        <input type="text" class="inpt-cadastro" id="selecao">

        <p class="p-cadastro">posição: </p>
        <input type="text" class="inpt-cadastro" id="posicao">

        <p class="p-cadastro">preço: </p>
        <input type="text" class="inpt-cadastro" id="preco">

        <p class="p-cadastro">raridade: </p>
        <input type="text" class="inpt-cadastro" id="raridade">

        <input type="submit" class="inpt-summit-cadastro" id="submit-cadastro" onclick="retornarValores()">
    </div>

</div>

<script src="scriptCadastro.js" defer></script>
</body>
</html>
